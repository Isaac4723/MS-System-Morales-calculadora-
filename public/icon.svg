<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Central Emblem / MS Logo -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge background -->
    <path d="M256 90 L390 140 V260 C390 350 256 420 256 420 C256 420 122 350 122 260 V140 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
    
    <!-- Bold MS letters -->
    <text x="256" y="275" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="125" fill="#ffffff" text-anchor="middle" letter-spacing="2">MS</text>
    
    <!-- Subtitle / Monetary Badge -->
    <text x="256" y="340" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="34" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">Bs. $</text>
  </g>
</svg>
